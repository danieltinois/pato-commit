spring:
  application:
    name: pato-commit

  # No authentication exists yet (deferred to M8). The API is therefore bound to
  # the loopback interface only; do not widen this without adding auth first.
  main:
    banner-mode: off

  threads:
    # Java 25 virtual threads. Webhook handlers are IO-bound and short-lived, so
    # this is the right default: no pool sizing, no queue depth to reason about.
    virtual:
      enabled: true

  datasource:
    url: ${PATO_COMMIT_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/pato_commit}
    username: ${PATO_COMMIT_DATASOURCE_USERNAME:pato_commit}
    password: ${PATO_COMMIT_DATASOURCE_PASSWORD:pato_commit}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only verifies that entities match it and
      # fails the boot on drift. Never 'update' or 'create'.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  devservices:
    # Local infrastructure is defined in compose.yaml and versioned there. Spring's
    # Dev Services would start an unversioned database behind our back.
    enabled: false

server:
  port: ${PATO_COMMIT_API_PORT:8080}
  address: 127.0.0.1
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

pato-commit:
  webhook:
    # GitHub webhook secret. Empty until the GitHub App exists (M2); while it is
    # empty the intake rejects every delivery rather than accepting unsigned ones.
    secret: ${PATO_COMMIT_GITHUB_WEBHOOK_SECRET:}
    # A claimed delivery is handed back to the sweeper if it is still not finished
    # after this long. Must stay above the worst-case handler runtime.
    stale-after: PT5M
    max-attempts: 3
    recovery-batch-size: 50
    recovery-interval: PT30S

logging:
  pattern:
    # %X{correlationId} is populated by CorrelationIdFilter.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:--}] %logger{36} - %msg%n"
  level:
    org.springframework.web: INFO
