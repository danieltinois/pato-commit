# Local infrastructure for Pato Commit. The applications themselves run on the host
# (mvn spring-boot:run / npm run dev) so that the edit loop does not go through a
# container rebuild.
#
# Redis is deliberately absent: nothing in the MVP needs it. See docs/adr when it
# arrives (M8, with authentication).
name: pato-commit

services:

  postgres:
    image: postgres:18-alpine
    container_name: pato-commit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pato_commit}
      POSTGRES_USER: ${POSTGRES_USER:-pato_commit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pato_commit}
    # Loopback only: an unauthenticated database has no business on the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores data in a major-version-specific subdirectory. The
      # image requires the mount to sit at /var/lib/postgresql, not at
      # /var/lib/postgresql/data, so that pg_upgrade --link works later.
      # See docker-library/postgres#1259.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pato_commit} -d ${POSTGRES_DB:-pato_commit}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
